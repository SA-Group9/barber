services:
  db:
    image: mysql:8.4
    container_name: barber-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
      MYSQL_DATABASE: mydb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "1234:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./api-barber
    container_name: barber-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/mydb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
    ports:
      - "8080:8080"
    restart: on-failure

  frontend:
    build: ./ng-barber
    container_name: barber-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    restart: on-failure

volumes:
  mysql_data: